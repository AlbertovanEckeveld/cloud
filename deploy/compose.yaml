# Staging deployment on ave-dev-cloud.albertove.cloud (ADR 0019).
#
#   NetBird :8080 ── platform ── network ave-cloud ── postgres, rustfs (docker/dev-setup)
#   Collabora: the existing instance on :9980 (COLLABORA_URL in platform.env)
#
# For now plain http, only on the NetBird address: WireGuard encrypts the
# traffic, but the platform runs in development mode and passkeys do not
# work. Start and update with ./update.sh, which picks the signed platform
# image (ADR 0020).

name: cloud-staging

services:
  platform:
    # A signed image from GHCR, pinned by digest. update.sh verifies the
    # signature and writes the digest to release.env.
    image: ${PLATFORM_IMAGE:?start the stack with ./update.sh}
    restart: unless-stopped
    env_file: platform.env
    ports:
      - "${BIND_IP:?set BIND_IP to the NetBird address}:8080:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      ave-cloud: {}

networks:
  # Postgres and RustFS from docker/dev-setup.
  ave-cloud:
    external: true
