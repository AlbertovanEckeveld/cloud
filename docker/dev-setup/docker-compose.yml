
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ave-cloud-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb/01-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ave-cloud


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ave-cloud-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ave-cloud


  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: ave-cloud-rustfs
    restart: unless-stopped

    command: ["/data"]

    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - rustfs_data:/data

    networks:
      - ave-cloud


  collabora:
    image: collabora/code:latest
    container_name: ave-cloud-collabora
    restart: unless-stopped

    cap_add:
      - MKNOD

    environment:
      # Collabora admin account
      username: ${COLLABORA_ADMIN_USER}
      password: ${COLLABORA_ADMIN_PASSWORD}

      # Allow your application as WOPI host
      aliasgroup1: "http://albertove-msi.albertove.cloud:8443"

      # Reverse proxy handles HTTPS
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:server_name=ave-dev-cloud.albertove.cloud

    ports:
      - "9980:9980"

    networks:
      - ave-cloud


volumes:
  postgres_data:
  rustfs_data:
  pgadmin_data:


networks:
  ave-cloud:
    name: ave-cloud
    driver: bridge
